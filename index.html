<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amrinerary</title>
    <meta
      name="description"
      content="Amrit's anticipated travel itinerary with timeline, map, calendar, and per-stop comments."
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <p class="eyebrow">Editorial travel log</p>
        <h1>Amrinerary</h1>
        <p class="subtitle">Amrit&rsquo;s anticipated travel itinerary</p>
        <div class="hero-grid">
          <section class="highlight-panel">
            <div>
              <p class="section-kicker">Now</p>
              <div id="current-stop" class="highlight-card highlight-card-empty">
                Loading current stop...
              </div>
            </div>
            <div>
              <p class="section-kicker">Next</p>
              <div id="upcoming-stop" class="highlight-card highlight-card-empty">
                Loading upcoming stop...
              </div>
            </div>
          </section>
          <section class="control-panel">
            <label class="search-label" for="search-input">Search locations</label>
            <input
              id="search-input"
              class="search-input"
              type="search"
              placeholder="Try NYC, SF, Colombia, Sicily, CDMX..."
            />
            <div class="view-toggle" role="tablist" aria-label="Itinerary views">
              <button class="view-button is-active" data-view="timeline" type="button">Timeline</button>
              <button class="view-button" data-view="map" type="button">Map</button>
              <button class="view-button" data-view="calendar" type="button">Calendar</button>
            </div>
            <p id="results-summary" class="results-summary">Loading itinerary...</p>
          </section>
        </div>
      </header>

      <main class="layout">
        <section id="timeline-view" class="view-panel is-active" aria-label="Timeline view"></section>
        <section id="map-view" class="view-panel" aria-label="Map view">
          <div class="map-frame">
            <div id="map"></div>
          </div>
          <div id="map-empty" class="empty-state hidden">No mapped stops match this search yet.</div>
        </section>
        <section id="calendar-view" class="view-panel" aria-label="Calendar view"></section>
      </main>
    </div>

    <dialog id="stop-dialog" class="stop-dialog">
      <div class="dialog-header">
        <div>
          <p id="dialog-date" class="dialog-date"></p>
          <h2 id="dialog-title"></h2>
          <p id="dialog-subtitle" class="dialog-subtitle"></p>
        </div>
        <button id="dialog-close" class="dialog-close" type="button" aria-label="Close stop details">
          ×
        </button>
      </div>
      <p id="dialog-notes" class="dialog-notes"></p>
      <div id="dialog-commentbox" class="commentbox-slot"></div>
      <p id="dialog-commentbox-help" class="commentbox-help hidden">
        Add your CommentBox project ID in `app.js` to enable public per-stop discussion.
      </p>
    </dialog>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
